name: Check build and tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs for pull requests only. Runs for pushes to main fall
# back to their run id, forming a unique group: they never cancel or queue
# behind each other and always complete — the publish-packages workflow
# triggers on their completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  build-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install

    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter=!storybook -r run build

      - name: Lint packages
        run: |
          pnpm run --if-present lint

      - name: Test packages
        run: |
          pnpm run --if-present test

      # Storybook is excluded from "Build packages" above and is otherwise only built by Chromatic,
      # which is gated on pull-request state. Building it here turns a broken story, MDX doc, or
      # config change into a deterministic failure on every push. Reuses the packages built above.
      - name: Build Storybook
        run: pnpm --filter=storybook run build
