name: Check test coverage

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

# A new push to the PR makes the run in flight obsolete – cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report-test-coverage:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build icons package
        run: pnpm --filter @amsterdam/design-system-react-icons build

      - name: Run tests with coverage
        run: pnpm --filter @amsterdam/design-system-react test

      - name: Report test coverage
        if: ${{ !cancelled() }}
        uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2.13.2
        with:
          json-summary-path: packages/react/coverage/coverage-summary.json
          name: React components
          threshold-icons: '{"0": "🔴", "100": "🟢"}'
