# Based on https://evilmartians.com/chronicles/super-github-pages-budget-frontend-staging-with-storybook-and-more

name: Remove acceptance Storybook

on:
  pull_request:
    types: [closed]
    branches-ignore: [main]

permissions:
  contents: write
  deployments: write
  pull-requests: read

env:
  RAW_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
jobs:
  remove-demo-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.actor != 'dependabot[bot]' }}
    concurrency:
      group: gh-pages-writes
      queue: max
      cancel-in-progress: false
    steps:
      - name: Create branch name without text before first forward slash
        run: |
          BRANCH_NAME=$(printf '%s' "$RAW_BRANCH_NAME" | sed 's/[^/]*\///')
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Check out branch to access .nvmrc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check preview is still closed
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_pages_operation.py remove

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Check out gh-pages branch
        if: steps.current.outputs.allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages

      - name: Remove demo directory
        if: steps.current.outputs.allowed == 'true'
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch -- "demo-$BRANCH_NAME"
          if git diff --cached --quiet; then
            echo "No demo directory to remove."
            exit 0
          fi
          git commit -m "Remove feature branch folder"
          git push origin HEAD:gh-pages

      - name: Deactivate deployment
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1.5.0
        if: ${{ always() && steps.current.outputs.allowed == 'true' }}
        with:
          step: deactivate-env
          token: ${{ secrets.GITHUB_TOKEN }}
          env: demo-${{ env.BRANCH_NAME }}
