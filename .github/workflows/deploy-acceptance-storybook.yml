# Based on https://evilmartians.com/chronicles/super-github-pages-budget-frontend-staging-with-storybook-and-more

name: Deploy acceptance Storybook

on:
  push:
    branches-ignore: [main]
  pull_request:
    types: [opened, reopened]
    branches-ignore: [main]

permissions:
  contents: read

env:
  RAW_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  build:
    concurrency:
      group: build-acceptance-storybook-${{ github.actor == 'dependabot[bot]' && format('skip-{0}', github.run_id) || format('branch-{0}', github.head_ref || github.ref_name) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    outputs:
      branch_name: ${{ steps.branch.outputs.branch_name }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Create branch name without text before first forward slash
        id: branch
        run: |
          BRANCH_NAME=$(printf '%s' "$RAW_BRANCH_NAME" | sed 's/[^/]*\///')
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and Storybook
        env:
          STORYBOOK_BUILD_PATH: demo-${{ env.BRANCH_NAME }}
        run: pnpm build

      - name: Create a version mark
        run: |
          touch ./storybook/dist/${{ github.sha }}.txt

      - name: Upload Storybook build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-storybook
          path: storybook/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      deployments: write
      pull-requests: read
    concurrency:
      group: gh-pages-writes
      queue: max
      cancel-in-progress: false
    env:
      BRANCH_NAME: ${{ needs.build.outputs.branch_name }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository for guard script and deploy action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check preview is still current
        id: current
        run: python3 .github/scripts/check_pages_operation.py deploy

      - name: Download Storybook build
        if: steps.current.outputs.allowed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: acceptance-storybook
          path: storybook/dist

      - name: Create deployment
        if: steps.current.outputs.allowed == 'true'
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1.5.0
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.SOURCE_SHA }}
          env: demo-${{ env.BRANCH_NAME }}

      - name: Push to pages branch
        if: steps.current.outputs.allowed == 'true'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: storybook/dist
          target-folder: demo-${{ env.BRANCH_NAME }}
          force: false

      - name: Wait for GitHub Pages to be deployed
        if: steps.current.outputs.allowed == 'true'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 40
          retry_wait_seconds: 15
          command: |
            curl -sf "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/demo-$BRANCH_NAME/${{ github.sha }}.txt"

      - name: Update deployment status
        uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1.5.0
        if: ${{ always() && steps.deployment.outputs.deployment_id != '' }}
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: ${{ steps.deployment.outputs.env }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          env_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/demo-${{ env.BRANCH_NAME }}
