packages:
  - "packages/*"
  - "packages-proprietary/*"
  - "storybook"
  - "stylelint"
overrides:
  "@tootallnate/once@<3.0.1": "^3.0.1"
  "brace-expansion@<1.1.16": "^1.1.16"
  "brace-expansion@>=2.0.0 <2.1.2": "^2.1.2"
  "brace-expansion@>=3.0.0 <5.0.7": "^5.0.7"
  "esbuild@<0.28.1": "^0.28.1"
  "js-yaml@<4.3.0": "^4.3.0"
  "sigstore@<4.1.1": "^4.1.1"
  tar: "^7.5.19"
engineStrict: true
savePrefix: ""
# Explicitly mark these dependencies' install scripts as ignored.
# Under v11's default `strictDepBuilds: true`, packages with install scripts that
# aren't listed here would cause `pnpm install` to fail with ERR_PNPM_IGNORED_BUILDS.
# Setting `false` means: pnpm has been told not to run the script — neither runs nor errors.
allowBuilds:
  "@bundled-es-modules/glob": false
  "@parcel/watcher": false
  esbuild: false
  style-dictionary: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@storybook/addon-a11y@10.5.0"
  - "@storybook/addon-docs@10.5.0"
  - "@storybook/addon-links@10.5.0"
  - "@storybook/addon-themes@10.5.0"
  - "@storybook/builder-vite@10.5.0"
  - "@storybook/csf-plugin@10.5.0"
  - "@storybook/react-dom-shim@10.5.0"
  - "@storybook/react-vite@10.5.0"
  - "@storybook/react@10.5.0"
  - eslint-plugin-storybook@10.5.0
  - storybook-addon-pseudo-states@10.5.0
  - storybook@10.5.0
  - "@storybook/addon-mcp@0.7.0"
