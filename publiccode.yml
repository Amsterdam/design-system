publiccodeYmlVersion: "0.7"

name: Amsterdam Design System
url: https://github.com/Amsterdam/design-system.git
landingURL: https://designsystem.amsterdam
softwareType: library

platforms:
  - web

developmentStatus: stable

description:
  en:
    shortDescription: >-
      Reusable components, patterns and guidelines powering the City of
      Amsterdam’s digital services.

    longDescription: |
      The Amsterdam Design System is a collaborative, open-source toolkit
      that includes components, patterns, design tokens, and guidelines.
      It is designed to be accessible, responsive, robust, and adaptable
      to various tech stacks, so teams don’t need to build their
      frontends from scratch for every project.

      Our designers, developers, and suppliers use it to help citizens
      and other users recognise and trust our websites, making our
      digital services straightforward and enjoyable to use.

      We actively maintain the library and release new versions steadily.
      The project offers distinct packages for CSS, React, design tokens,
      and icons. Input from users contributes to the system’s development
      for everyone’s benefit.

      As part of the NL Design System community, other public organizations
      in the Netherlands customise these components for their own services.

    features:
      - Design tokens
      - CSS components
      - React components
      - Icons

  nl:
    shortDescription: >-
      Herbruikbare componenten, patronen en richtlijnen: het fundament onder
      de digitale dienstverlening van gemeente Amsterdam.

    longDescription: |
      Het Amsterdam Design System is een gezamenlijke open source toolkit met
      componenten, patronen, design tokens en richtlijnen. Het is toegankelijk,
      responsief, robuust en bruikbaar in verschillende technologieën, zodat
      teams hun frontend niet voor elk project opnieuw hoeven te bouwen.
  
      Onze ontwerpers, ontwikkelaars en leveranciers gebruiken het om inwoners
      en andere gebruikers onze websites te laten herkennen en vertrouwen,
      zodat onze digitale dienstverlening prettig en eenvoudig te gebruiken is.
  
      We onderhouden de bibliotheek actief en brengen regelmatig nieuwe versies
      uit. Het project biedt aparte releases voor CSS, React, design tokens en
      iconen. Inbreng van gebruikers helpt bij de ontwikkeling van het systeem,
      ten goede van iedereen.
  
      Als onderdeel van de NL Design System-community gebruiken andere publieke
      organisaties deze componenten voor hun eigen diensten, dankzij design tokens
      in hun eigen huisstijl.

    features:
      - Design tokens
      - CSS-componenten
      - React-componenten
      - Iconen

